name: GNSS pipeline - Tree
on: push

jobs:
  InstallAndBuild:
    name: Install, Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Create env file
        run: |
          echo "${{ vars.REACT_ENV }}" > .env

      - name: Cache node modules
        uses: actions/cache@v3
        id: cache-node-modules
        with:
          # Define multiple paths as an array
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-

      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Build react
        run: npm run build

      - name: Cache build
        if: github.ref == 'refs/heads/main'
        uses: actions/cache@v3
        with:
          path: ./build
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

  Deploy:
    needs: InstallAndBuild
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Restore cached build
        uses: actions/cache@v3
        with:
          path: ./build
          key: ${{ runner.os }}-build-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync ./build ${{ secrets.AWS_S3_BUCKET }} --follow-symlinks --delete

      - name: Invalidate CloudFront
        if: github.ref == 'refs/heads/main'
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT }} --paths "/*"
