  InstallAndBuild:
    name: Install, Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Create env file
        run: |
          echo "${{ vars.REACT_ENV }}" > .env

      - name: Cache node modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          # Define multiple paths as an array
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.OS }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.OS }}-node-

      - name: Install Dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm install

      - name: Build react
        run: npm run build

      - name: Create production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: ./build
          if-no-files-found: error
          retention-days: 1

  Deploy:
    needs: [InstallAndBuild]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: build
          path: ./build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3
        run: aws s3 sync ./build ${{ secrets.AWS_S3_BUCKET }} --follow-symlinks --delete

      - name: Invalidate CloudFront
        if: github.ref == 'refs/heads/main'
        run: aws cloudfront create-invalidation --distribution-id ${{ secrets.AWS_CLOUDFRONT }} --paths "/*"
